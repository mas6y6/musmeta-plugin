plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

def musmetaVersion = providers.gradleProperty('musmeta').get()

// ============================================================
// MusMeta app configuration
//
// Create this before adding dependencies or configuring tasks
// that use it. The correct JitPack group is
// com.github.mas6y6.MusMeta, not com.github.mas6y6.
// ============================================================

def musMetaApp = configurations.maybeCreate('musmetaApp')

musMetaApp.canBeResolved = true
musMetaApp.canBeConsumed = false
musMetaApp.transitive = false
musMetaApp.visible = false
musMetaApp.description =
        'The MusMeta app fat JAR used by runMusMeta, resolved from JitPack.'

dependencies {
    add(
            'musmetaApp',
            "com.github.mas6y6.MusMeta:MusMeta-app:${musmetaVersion}"
    )

    compileOnly(
            "com.github.mas6y6.MusMeta:framework:${musmetaVersion}"
    )

    compileOnly(
            "com.github.mas6y6.MusMeta:MusMeta:${musmetaVersion}"
    )
}

jar {
    archiveBaseName = rootProject.name
    archiveVersion = ''
}

// Stamp the MusMeta version the plugin was built against into plugin.json.
// The framework checks this value for compatibility.
// Set "musmeta": "*" in plugin.json to opt out of the check.
tasks.named('processResources') {
    filesMatching('plugin.json') {
        expand('musmeta': musmetaVersion)
    }
}

// ============================================================
// Plugin installation / local test run
//
// Gradle properties:
//   -Pmusmeta.home=<dir>    Isolated MusMeta home directory.
//   -Pmusmeta.plugins=<dir> Plugin installation directory.
//   -Pmusmeta.jar=<path>    Explicit MusMeta application JAR.
//   -Pmusmeta.args="..."    Arguments passed to MusMeta.
// ============================================================

def musMetaHome = providers.gradleProperty('musmeta.home').getOrNull()

def pluginsDir = providers.gradleProperty('musmeta.plugins')
        .orElse(
                providers.gradleProperty('musmeta.home')
                        .map { home -> "${home}/plugins" }
        )
        .orElse("${System.getProperty('user.home')}/.musmeta/plugins")
        .get()

tasks.register('publishPlugin', Copy) {
    group = 'plugins'
    description = 'Copies the built plugin JAR into the MusMeta plugins directory.'

    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into(pluginsDir)
}

// ============================================================
// Locate the MusMeta application JAR
// ============================================================

// Check for a locally built MusMeta fat JAR.
def localAppJars = layout.files {
    def libsDir = rootProject.file('../build/libs')

    if (!libsDir.isDirectory()) {
        return []
    }

    def candidates = (libsDir.listFiles() ?: []).findAll {
        it.isFile() && it.name.endsWith('-all.jar')
    }

    return candidates.sort { it.lastModified() }.reverse()
}

// Resolve the application JAR only when needed.
def musMetaAppJar = {
    // 1. Explicit override: -Pmusmeta.jar=<path>
    def explicit = providers.gradleProperty('musmeta.jar').getOrNull()

    if (explicit != null) {
        def jarFile = rootProject.file(explicit)

        if (!jarFile.isFile()) {
            throw new GradleException(
                    "musmeta.jar points to '${explicit}', which does not exist."
            )
        }

        return files(jarFile)
    }

    // 2. Locally built MusMeta application.
    def local = localAppJars

    if (!local.isEmpty()) {
        return local
    }

    // 3. Fall back to the JitPack application artifact.
    return musMetaApp
}()

tasks.register('runMusMeta', JavaExec) {
    group = 'plugins'
    description = 'Installs the plugin and launches the MusMeta application.'

    dependsOn tasks.named('publishPlugin')

    mainClass.set('com.mas6y6.musmeta.launch.Launcher')
    classpath = musMetaAppJar
    workingDir = rootProject.projectDir

    jvmArgs '-Xmx1G'
    jvmArgs "-Dmusmeta.plugins=${pluginsDir}"

    if (musMetaHome != null) {
        jvmArgs "-Dmusmeta.home=${musMetaHome}"
    }

    def programArgs = providers.gradleProperty('musmeta.args').getOrNull()

    if (programArgs != null) {
        args = programArgs.split('\\s+').toList()
    }
}